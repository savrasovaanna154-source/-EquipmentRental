<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Прокат</title>
    <!-- Подключаем наши общие стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Шапка, как на главной -->
    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-box-open"></i> Прокат
        </a>
        <a href="index.html" class="btn-login">На главную</a>
    </header>

    <!-- Обертка для центрирования формы -->
    <div class="auth-wrapper">
        <div class="login-container">
            <h2>Регистрация</h2>
            
            <!-- Форма отправляет данные на главную (пока имитация) -->
            <form action="index.html">
                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (999) 123-45-67" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-submit">Зарегистрироваться</button>
            </form>

            <div class="auth-link">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
            
            <div class="auth-link back-link">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Вернуться в каталог</a>
            </div>
        </div>
    </div>

</body>
</html>
