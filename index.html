<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокат оборудования</title>
    <!-- Подключаем внешний файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Прокат оборудования</h1>
        <a href="#" class="btn-login">Войти / Регистрация</a>
    </header>

    <main>
        <h2>Каталог инвентаря</h2>
        <div class="catalog">
            <!-- Карточка 1 -->
            <div class="card">
                <h3>Палатка 4-местная</h3>
                <p>Категория: Туризм</p>
                <p>Состояние: Отличное</p>
                <p class="price">500 ₽ / сутки</p>
                <button class="btn-book" onclick="alert('Для бронирования нужно войти в систему')">Забронировать</button>
            </div>
            
            <!-- Карточка 2 -->
            <div class="card">
                <h3>Перфоратор Bosch</h3>
                <p>Категория: Строительство</p>
                <p>Состояние: Хорошее</p>
                <p class="price">800 ₽ / сутки</p>
                <button class="btn-book" onclick="alert('Для бронирования нужно войти в систему')">Забронировать</button>
            </div>

            <!-- Карточка 3 -->
            <div class="card">
                <h3>Велосипед горный</h3>
                <p>Категория: Спорт</p>
                <p>Состояние: Отличное</p>
                <p class="price">600 ₽ / сутки</p>
                <button class="btn-book" onclick="alert('Для бронирования нужно войти в систему')">Забронировать</button>
            </div>
        </div>
    </main>
</body>
</html>
