<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора - Прокат</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-box-open"></i> Прокат
        </a>
        <div>
            <span style="margin-right: 15px; font-weight: 600; color: #4f46e5;">
                <i class="fa-solid fa-user-shield"></i> Администратор
            </span>
            <!-- Кнопка выхода ведет на главную -->
            <a href="index.html" class="btn-login">Выйти</a>
        </div>
    </header>

    <main style="max-width: 1100px; margin: 0 auto; padding: 0 20px;">
        <h2 style="margin-top: 30px;">Панель администратора</h2>
        <p style="color: #6b7280; margin-bottom: 20px;">Управление каталогом, складом и статистикой</p>

        <div class="account-section">
            <h3><i class="fa-solid fa-chart-line"></i> Статистика за всё время</h3>
            
            <!-- Карточки статистики (оживляются скриптом внизу) -->
            <div style="display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px; background: #eff6ff; padding: 20px; border-radius: 12px; border: 1px solid #bfdbfe;">
                    <p style="color: #1e40af; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;">Всего броней</p>
                    <p id="stat-total-bookings" style="color: #1e3a8a; font-size: 2rem; font-weight: 800;">0</p>
                </div>
                <div style="flex: 1; min-width: 200px; background: #ecfdf5; padding: 20px; border-radius: 12px; border: 1px solid #a7f3d0;">
                    <p style="color: #047857; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;">Выручка</p>
                    <p id="stat-revenue" style="color: #064e3b; font-size: 2rem; font-weight: 800;">0 ₽</p>
                </div>
                <div style="flex: 1; min-width: 200px; background: #fef2f2; padding: 20px; border-radius: 12px; border: 1px solid #fecaca;">
                    <p style="color: #b91c1c; font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;">Активных броней</p>
                    <p id="stat-active" style="color: #7f1d1d; font-size: 2rem; font-weight: 800;">0</p>
                </div>
            </div>

            <!-- Блок с кнопкой перехода на склад -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 40px;">
                <h4 style="color: #111827; margin: 0;">Последние бронирования (Автоматически)</h4>
                <a href="warehouse.html" class="btn-submit" style="width: auto; padding: 10px 20px; text-decoration: none; display: inline-block; font-size: 0.9rem;">
                    <i class="fa-solid fa-warehouse"></i> Перейти на склад
                </a>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Клиент</th>
                            <th>Оборудование</th>
                            <th>Даты</th>
                            <th>Сумма</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Данные появятся здесь благодаря скрипту -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- СКРИПТ ДЛЯ АВТОМАТИЧЕСКОЙ СТАТИСТИКИ И ТАБЛИЦЫ -->
    <script>
        // 1. Загружаем реальные брони из памяти браузера
        let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

        // 2. Считаем статистику
        const totalBookings = bookings.length;
        let totalRevenue = 0;
        
        bookings.forEach(b => {
            // Достаем цифры из строки цены (например, из "18400 ₽ (23 сут.)" достаем 18400)
            const priceMatch = b.totalPrice.match(/\d+/); 
            if (priceMatch) totalRevenue += parseInt(priceMatch[0]);
        });

        // Активные брони — это все, кроме возвращенных
        const activeBookings = bookings.filter(b => b.status !== 'returned').length;

        // 3. Выводим цифры на экран
        document.getElementById('stat-total-bookings').innerText = totalBookings;
        document.getElementById('stat-revenue').innerText = totalRevenue.toLocaleString('ru-RU') + ' ₽';
        document.getElementById('stat-active').innerText = activeBookings;

        // 4. Автоматически строим таблицу с бронями
        const tableBody = document.getElementById('admin-table-body');

        if (bookings.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px; color:#6b7280;">Пока нет ни одной брони</td></tr>';
        } else {
            // Переворачиваем массив, чтобы новые брони были сверху
            [...bookings].reverse().forEach((b, index) => {
                // Красиво форматируем даты
                const start = b.startDate.split('-').reverse().join('.');
                const end = b.endDate.split('-').reverse().join('.');
                
                // Определяем цвет и текст статуса
                let statusText = 'Ожидает';
                let statusClass = 'status-pending';
                
                if (b.status === 'confirmed') {
                    statusText = 'Подтверждено';
                    statusClass = 'status-active';
                } else if (b.status === 'issued') {
                    statusText = 'Выдано';
                    statusClass = 'status-overdue';
                } else if (b.status === 'returned') {
                    statusText = 'Возвращено';
                    statusClass = 'status-active';
                }

                // Создаем строку таблицы
                const row = `
                    <tr>
                        <td>${totalBookings - index}</td>
                        <td>${b.clientName || 'Клиент'}</td>
                        <td>${b.equipment}</td>
                        <td>${start} - ${end}</td>
                        <td>${b.totalPrice}</td>
                        <td><span class="status ${statusClass}">${statusText}</span></td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
